name: CI

# PR and main: unit tests and production build.
# main: image ghcr.io/rr2000/money-manage-app on GitHub Container Registry, :sha-<commit> and :main.
# PR from a branch of this repo: the same image as :pr-<number> and :sha-<commit of the branch>, to try it on money-dev
# before the merge (ferraglia: Actions > deploy > money-develop). PRs from forks get no image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # PR: the branch itself (by default a PR checks out the merge with main)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: tag
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          image=ghcr.io/rr2000/money-manage-app
          if [ -n "$PR" ]; then
            # the commit of the branch, not the merge commit GitHub makes for the PR
            printf 'tags<<EOF\n%s:sha-%s\n%s:pr-%s\nEOF\n' "$image" "${HEAD_SHA::7}" "$image" "$PR" >> "$GITHUB_OUTPUT"
          else
            printf 'tags<<EOF\n%s:sha-%s\n%s:main\nEOF\n' "$image" "${GITHUB_SHA::7}" "$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/RR2000/money-manage-app
          cache-from: type=gha
          cache-to: type=gha,mode=max
