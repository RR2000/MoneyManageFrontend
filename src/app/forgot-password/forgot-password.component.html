<div class="auth">
  <div class="brand"><span class="brand-mark" aria-hidden="true">m</span>Money Manage</div>
  <form novalidate (ngSubmit)="submit()">
    <h1>{{ 'forgot.title' | t }}</h1>
    @if (!sent()) {
      <p class="hint" id="forgot-hint">{{ 'forgot.hint' | t }}</p>
      <div class="field">
        <label for="forgot-email">{{ 'forgot.email' | t }}</label>
        <input id="forgot-email" name="email" type="email" [(ngModel)]="email" required autocomplete="email"
               aria-describedby="forgot-hint" [attr.aria-invalid]="!!error() || null">
      </div>
      @if (error()) {
        <p class="line bad" role="alert"><app-icon name="error"/><span>{{ error() }}</span></p>
      }
      <button type="submit" class="btn primary" [disabled]="busy() || !email">
        {{ (busy() ? 'common.wait' : 'forgot.submit') | t }}
      </button>
      @if (busy()) {
        <span class="sr-only" role="status">{{ 'common.wait' | t }}</span>
      }
    } @else {
      <p class="line ok" role="status"><app-icon name="ok"/><span>{{ 'forgot.sent' | t }}</span></p>
    }
    <div class="links"><a routerLink="/login">{{ 'forgot.back' | t }}</a></div>
  </form>
</div>
