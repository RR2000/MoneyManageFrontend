<main class="login-container">
  <h1>Money Manage</h1>
  <form (ngSubmit)="submit()">
    <h2>{{ 'forgot.title' | t }}</h2>
    @if (!sent()) {
      <p class="hint">{{ 'forgot.hint' | t }}</p>
      <label>{{ 'forgot.email' | t }}
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="email">
      </label>
      @if (error()) {
        <div class="error" role="alert">{{ error() }}</div>
      }
      <button type="submit" class="primary" [disabled]="busy() || !email">
        {{ (busy() ? 'common.wait' : 'forgot.submit') | t }}
      </button>
    } @else {
      <p role="status">{{ 'forgot.sent' | t }}</p>
    }
    <a class="back" routerLink="/login">{{ 'forgot.back' | t }}</a>
  </form>
</main>
