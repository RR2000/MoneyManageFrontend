@if (loading) {
  <p class="empty" role="status">Caricamento...</p>
} @else if (error) {
  <div class="error" role="alert">
    <span>{{ error }}</span>
    <button type="button" (click)="retry.emit()">Riprova</button>
  </div>
} @else if (!hasData()) {
  <p class="empty">{{ emptyText }}</p>
}
<div class="chart-container" [class.hidden]="!hasData()">
  <canvas #canvas></canvas>
</div>
