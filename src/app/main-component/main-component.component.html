<div class="page">
  @if (accountsError()) {
    <div class="error" role="alert">
      <span>{{ accountsError() | t }}</span>
      <button type="button" (click)="getDataAndRenderComponents()">{{ 'common.retry' | t }}</button>
    </div>
  }
  @if (loaded() && accountNames().length === 0) {
    <div class="empty">
      <p>{{ 'dashboard.empty' | t }} <a routerLink="/import">{{ 'dashboard.emptyImport' | t }}</a>
        {{ 'dashboard.emptyRest' | t }}</p>
      <button type="button" (click)="loadSampleData()" [disabled]="sampleLoading()">
        {{ (sampleLoading() ? 'common.loading' : 'dashboard.sample') | t }}
      </button>
    </div>
  }
  <mat-tab-group>
    <mat-tab [label]="'dashboard.tab.balances' | t">
      <ng-template matTabContent>
        <app-line-graph [graphPoints]="graphPoints()" [loading]="bankGraphLoading()" [error]="bankGraphError() | t"
                        (retry)="getDataAndRenderComponents()"
                        [emptyText]="'dashboard.noBalances' | t"></app-line-graph>
      </ng-template>
    </mat-tab>
    <mat-tab [label]="'dashboard.tab.movements' | t">
      <ng-template matTabContent>
        <app-transactions-table [accountsData]="accountsData()"></app-transactions-table>
      </ng-template>
    </mat-tab>
    <mat-tab [label]="'dashboard.tab.investments' | t">
      <ng-template matTabContent>
        <app-line-graph [graphPoints]="brokerGraph()" [loading]="brokerGraphLoading()" [error]="brokerGraphError() | t"
                        (retry)="refreshBrokerGraph()"
                        [emptyText]="'dashboard.noInvestments' | t"></app-line-graph>
        <app-instruments (changed)="refreshBrokerGraph()"></app-instruments>
      </ng-template>
    </mat-tab>
    <mat-tab [label]="'dashboard.tab.monteCarlo' | t">
      <ng-template matTabContent>
        <app-monte-carlo></app-monte-carlo>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
