<div class="mc-container">
  <h3>{{ 'monteCarlo.title' | t }}</h3>

  <div class="controls">
    <mat-form-field>
      <mat-label>{{ 'monteCarlo.years' | t }}</mat-label>
      <input matInput type="number" [(ngModel)]="years" min="1" max="50"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'monteCarlo.simulations' | t }}</mat-label>
      <input matInput type="number" [(ngModel)]="simulations" min="100" max="20000" step="1000"/>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="run()" [disabled]="loading()">
      {{ (loading() ? 'monteCarlo.running' : 'monteCarlo.run') | t }}
    </button>
  </div>

  <p *ngIf="error()" class="error">{{ error() }}</p>

  <p class="legend-note">
    <strong>P50</strong> = {{ 'monteCarlo.median' | t }} &nbsp;|&nbsp;
    <strong>P5–P95</strong> = {{ 'monteCarlo.range' | t }} &nbsp;|&nbsp;
    {{ 'monteCarlo.basis' | t }}
  </p>

  <div class="chart-box"><canvas id="MonteCarloChart"></canvas></div>
</div>
