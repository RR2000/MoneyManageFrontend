<div class="mc-container">
  <h2>{{ 'monteCarlo.title' | t }}</h2>

  <div class="controls">
    <mat-form-field>
      <mat-label>{{ 'monteCarlo.years' | t }}</mat-label>
      <input matInput type="number" [(ngModel)]="years" min="1" max="50"/>
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'monteCarlo.simulations' | t }}</mat-label>
      <input matInput type="number" [(ngModel)]="simulations" min="100" max="20000" step="1000"/>
    </mat-form-field>

    <button mat-flat-button (click)="run()" [disabled]="loading()">
      {{ (loading() ? 'monteCarlo.running' : 'monteCarlo.run') | t }}
    </button>
  </div>

  <p class="legend-note">{{ 'monteCarlo.basis' | t }}</p>

  @if (loading()) {
    <app-load-state state="loading" shape="chart"/>
  } @else if (error()) {
    <app-load-state state="error" [errorText]="error()" (retry)="run()"/>
  } @else if (data()) {
    <app-chart [labels]="labels()" [series]="series()" [band]="band()" [height]="340"
               [ariaLabel]="'monteCarlo.title' | t"/>
  }
</div>
